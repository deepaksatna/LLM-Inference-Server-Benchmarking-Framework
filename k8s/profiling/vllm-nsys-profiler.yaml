# vLLM Nsight Systems GPU Profiler Job
#
# This job profiles vLLM inference server with NVIDIA Nsight Systems
# capturing full CUDA kernel timeline, memory operations, and GPU metrics.
#
# Prerequisites:
#   1. nsys .deb package copied to GPU node at /tmp/nsight-systems-cli-2025.6.1.deb
#   2. Scale down existing vLLM deployment: kubectl scale deployment vllm-server -n bench --replicas=0
#   3. OCI registry secret 'ocirsecret' in bench namespace
#
# Usage:
#   kubectl apply -f vllm-nsys-profiler.yaml
#   kubectl logs -f job/vllm-nsys-profiler -n bench
#   kubectl cp bench/<pod-name>:/results/vllm_gpu_timeline.nsys-rep ./vllm_gpu_timeline.nsys-rep

apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-nsys-profiler
  namespace: bench
  labels:
    app: vllm-nsys-profiler
    profiler: nsys
    server: vllm
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200  # Auto-cleanup after 2 hours
  template:
    metadata:
      labels:
        app: vllm-nsys-profiler
        profiler: nsys
    spec:
      restartPolicy: Never
      serviceAccountName: bench-sa
      imagePullSecrets:
        - name: ocirsecret

      containers:
      - name: vllm-profiler
        image: fra.ocir.io/frntrd2vyxvi/models:llm-vllm-offline-v1
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "=============================================="
            echo "  vLLM Server GPU Profiling with Nsight Systems"
            echo "=============================================="
            echo "Start time: $(date)"
            echo ""

            # ============================================
            # Step 1: Install Nsight Systems
            # ============================================
            echo "Step 1: Installing Nsight Systems..."

            if [ -f /tmp/nsight-systems-cli.deb ]; then
                dpkg -i /tmp/nsight-systems-cli.deb 2>&1 | tail -5
                echo "nsys installed from mounted package"
            else
                echo "ERROR: nsys package not found at /tmp/nsight-systems-cli.deb"
                echo "Please copy the package to the GPU node first"
                exit 1
            fi

            # Use full path to avoid PATH issues
            NSYS="/opt/nvidia/nsight-systems-cli/2025.6.1/bin/nsys"

            if [ ! -f "$NSYS" ]; then
                echo "ERROR: nsys binary not found at $NSYS"
                ls -la /opt/nvidia/ 2>/dev/null || echo "nsys directory not found"
                exit 1
            fi

            echo "nsys version:"
            $NSYS --version
            echo ""

            # ============================================
            # Step 2: Create results directory
            # ============================================
            mkdir -p /results
            echo "Results directory: /results"
            echo ""

            # ============================================
            # Step 3: Start vLLM with nsys profiling
            # ============================================
            echo "Step 3: Starting vLLM server with nsys GPU profiling..."
            echo "This will capture CUDA kernels, memory operations, and GPU timeline"
            echo ""
            echo "Profiling configuration:"
            echo "  - Trace: cuda, nvtx, cudnn, cublas, osrt"
            echo "  - Duration: 240 seconds max"
            echo "  - CUDA memory tracking: enabled"
            echo "  - Kernel backtraces: enabled"
            echo ""

            # Start vLLM wrapped with nsys profiling
            $NSYS profile \
                --output=/results/vllm_gpu_timeline \
                --trace=cuda,nvtx,cudnn,cublas,osrt \
                --cuda-memory-usage=true \
                --cudabacktrace=kernel \
                --force-overwrite=true \
                --duration=240 \
                --sample=process-tree \
                --backtrace=dwarf \
                python3 -m vllm.entrypoints.openai.api_server \
                    --model mistralai/Mistral-7B-Instruct-v0.2 \
                    --host 0.0.0.0 \
                    --port 8000 \
                    --tensor-parallel-size 1 \
                    --max-model-len 4096 \
                    --gpu-memory-utilization 0.85 \
                    --dtype auto &

            VLLM_PID=$!
            echo "vLLM process started with PID: $VLLM_PID"
            echo ""

            # ============================================
            # Step 4: Wait for server to be ready
            # ============================================
            echo "Step 4: Waiting for vLLM server to be ready..."
            SERVER_READY=false
            for i in $(seq 1 120); do
                if curl -s http://localhost:8000/health > /dev/null 2>&1; then
                    echo "vLLM server is ready! (attempt $i)"
                    SERVER_READY=true
                    break
                fi
                if [ $((i % 10)) -eq 0 ]; then
                    echo "  Still waiting... ($i/120)"
                fi
                sleep 5
            done

            if [ "$SERVER_READY" = false ]; then
                echo "ERROR: vLLM server failed to start within timeout"
                echo "Check GPU memory and model availability"
                exit 1
            fi
            echo ""

            # ============================================
            # Step 5: Generate inference load
            # ============================================
            echo "Step 5: Generating inference load for GPU profiling..."
            echo "Sending 10 inference requests @ 200 tokens each..."
            echo ""

            for i in $(seq 1 10); do
                echo "  Request $i/10..."
                RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8000/v1/completions \
                    -H "Content-Type: application/json" \
                    -d '{
                        "model": "mistralai/Mistral-7B-Instruct-v0.2",
                        "prompt": "Explain transformer self-attention mechanism with mathematical details. Include the scaled dot-product attention formula Q*K^T/sqrt(d_k), multi-head attention with concatenation and linear projection. Also explain positional encoding.",
                        "max_tokens": 200
                    }')
                HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                if [ "$HTTP_CODE" = "200" ]; then
                    echo "    Request $i completed successfully"
                else
                    echo "    Request $i returned HTTP $HTTP_CODE"
                fi
                sleep 2
            done

            echo ""
            echo "All inference requests completed."
            echo ""

            # ============================================
            # Step 6: Wait for profiling to complete
            # ============================================
            echo "Step 6: Waiting for nsys profiling to complete..."
            echo "This may take 1-2 minutes for profile generation..."

            # Wait for nsys/vllm process to finish (or timeout)
            wait $VLLM_PID 2>/dev/null || true

            echo ""
            echo "=============================================="
            echo "  Profiling Complete"
            echo "=============================================="
            echo ""

            # ============================================
            # Step 7: Display results
            # ============================================
            echo "Generated profile files:"
            ls -lh /results/
            echo ""

            # Verify profile was generated
            if [ -f /results/vllm_gpu_timeline.nsys-rep ]; then
                PROFILE_SIZE=$(ls -lh /results/vllm_gpu_timeline.nsys-rep | awk '{print $5}')
                echo "SUCCESS: Profile generated - $PROFILE_SIZE"
                echo ""
                echo "To extract the profile:"
                echo "  kubectl cp bench/$(hostname):/results/vllm_gpu_timeline.nsys-rep ./vllm_gpu_timeline.nsys-rep"
                echo ""
                echo "To view the profile:"
                echo "  nsys-ui vllm_gpu_timeline.nsys-rep"
            else
                echo "WARNING: Profile file not found. Check nsys output above."
            fi

            echo ""
            echo "End time: $(date)"
            echo ""
            echo "Keeping pod alive for file extraction (30 minutes)..."
            sleep 1800

        env:
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: TRANSFORMERS_OFFLINE
          value: "0"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"

        resources:
          requests:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
          limits:
            memory: "48Gi"
            cpu: "16"
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: nsys-package
          mountPath: /tmp/nsight-systems-cli.deb
          subPath: nsight-systems-cli-2025.6.1.deb
        - name: results
          mountPath: /results
        - name: dshm
          mountPath: /dev/shm

      volumes:
      # nsys package from host (copy to node first)
      - name: nsys-package
        hostPath:
          path: /tmp/nsight-systems-cli-2025.6.1.deb
          type: File
      # Results directory
      - name: results
        emptyDir: {}
      # Shared memory for PyTorch
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"

      nodeSelector:
        nvidia.com/gpu: "true"

      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
