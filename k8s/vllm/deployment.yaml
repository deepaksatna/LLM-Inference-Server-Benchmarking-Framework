---
# vLLM Inference Server Deployment
# High-throughput LLM serving with PagedAttention
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: bench
  labels:
    app: vllm-server
    backend: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
        backend: vllm
    spec:
      serviceAccountName: bench-sa
      imagePullSecrets:
        - name: ocirsecret

      containers:
      - name: vllm
        # OFFLINE IMAGE: Pre-downloaded Mistral-7B model
        image: fra.ocir.io/frntrd2vyxvi/models:llm-vllm-offline-v1
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model"
          - "mistralai/Mistral-7B-Instruct-v0.2"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--tensor-parallel-size"
          - "1"
          - "--max-model-len"
          - "8192"
          - "--gpu-memory-utilization"
          - "0.90"
          - "--dtype"
          - "auto"
          - "--trust-remote-code"

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        env:
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: TRANSFORMERS_CACHE
          value: "/root/.cache/huggingface"
        # Disable offline mode at runtime - model is cached, vLLM needs to find it
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: TRANSFORMERS_OFFLINE
          value: "0"
        # NCCL network interface for OKE (critical for GPU communication)
        - name: NCCL_SOCKET_IFNAME
          value: "ens3"
        # Uncomment if using HF token for gated models
        # - name: HF_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: hf-token
        #       key: token

        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
        - name: dshm
          mountPath: /dev/shm

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10

      volumes:
      - name: model-cache
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "8Gi"

      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

      nodeSelector:
        nvidia.com/gpu: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: bench
spec:
  type: ClusterIP
  selector:
    app: vllm-server
  ports:
  - port: 8000
    targetPort: 8000
    name: http
---
# LoadBalancer for external access (optional)
apiVersion: v1
kind: Service
metadata:
  name: vllm-external
  namespace: bench
spec:
  type: LoadBalancer
  selector:
    app: vllm-server
  ports:
  - port: 80
    targetPort: 8000
    name: http
