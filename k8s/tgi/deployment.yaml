---
# HuggingFace Text Generation Inference (TGI) Deployment
# Optimized LLM serving with Flash Attention
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgi-server
  namespace: bench
  labels:
    app: tgi-server
    backend: tgi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tgi-server
  template:
    metadata:
      labels:
        app: tgi-server
        backend: tgi
    spec:
      serviceAccountName: bench-sa
      imagePullSecrets:
        - name: ocirsecret

      containers:
      - name: tgi
        # OFFLINE IMAGE: Pre-downloaded Mistral-7B model
        image: fra.ocir.io/frntrd2vyxvi/models:llm-tgi-offline-v1
        args:
          - "--model-id"
          - "mistralai/Mistral-7B-Instruct-v0.2"
          - "--port"
          - "8000"
          - "--max-input-length"
          - "4096"
          - "--max-total-tokens"
          - "8192"
          - "--max-batch-prefill-tokens"
          - "8192"
          - "--max-concurrent-requests"
          - "64"
          - "--dtype"
          - "float16"
          # Uncomment for quantization
          # - "--quantize"
          # - "bitsandbytes-nf4"

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        env:
        - name: HF_HOME
          value: "/data"
        - name: HUGGINGFACE_HUB_CACHE
          value: "/data"
        - name: TRANSFORMERS_CACHE
          value: "/data"
        # Disable offline mode at runtime - model is cached
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: TRANSFORMERS_OFFLINE
          value: "0"
        # NCCL network interface for OKE (critical for GPU communication)
        - name: NCCL_SOCKET_IFNAME
          value: "ens3"
        # Uncomment if using HF token for gated models
        # - name: HF_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: hf-token
        #       key: token

        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: model-cache
          mountPath: /data
        - name: dshm
          mountPath: /dev/shm

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10

      volumes:
      - name: model-cache
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "8Gi"

      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

      nodeSelector:
        nvidia.com/gpu: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: tgi-service
  namespace: bench
spec:
  type: ClusterIP
  selector:
    app: tgi-server
  ports:
  - port: 8000
    targetPort: 8000
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: tgi-external
  namespace: bench
spec:
  type: LoadBalancer
  selector:
    app: tgi-server
  ports:
  - port: 80
    targetPort: 8000
    name: http
